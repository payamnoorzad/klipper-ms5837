# Example: MS5837-02BA on RP2040-Zero using software I2C

[ms5837 chamber_pressure]
model: 02BA

i2c_software_sda_pin: gpio0
i2c_software_scl_pin: gpio1

#i2c_bus: i2c0a

i2c_address: 118 #0x76
i2c_speed: 100000

pressure_unit: mbar
sample_interval: 0.5
filter_samples: 5
fluid_density: 997
auto_start: True


# Commands:
#
# MS5837_QUERY SENSOR=chamber_pressure
# MS5837_ZERO SENSOR=chamber_pressure
# MS5837_STATUS SENSOR=chamber_pressure
