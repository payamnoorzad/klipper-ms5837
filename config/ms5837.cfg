# =====================================================================
# Klipper MS5837 Pressure & Temperature Sensor Configuration
# Supports TE Connectivity MS5837-02BA and MS5837-30BA sensors
# =====================================================================

[ms5837 chamber_pressure]
# Sensor model: 02BA (0-2 bar, high resolution) or 30BA (0-30 bar)
# Default is 02BA.
model: 02BA

# I2C Communication Settings:
# Software I2C (example using RP2040 GPIO pins):
i2c_software_sda_pin: gpio0
i2c_software_scl_pin: gpio1

# Hardware I2C (uncomment below and comment software pins if using HW I2C):
# i2c_bus: i2c0a
# i2c_mcu: mcu

# I2C Device Address (0x76 = 118 in decimal)
i2c_address: 118
i2c_speed: 100000

# Pressure display unit: mbar, bar, kPa, Pa, psi
# Default is mbar.
pressure_unit: mbar

# Background sampling interval in seconds (minimum 0.05s).
# Default is 0.5s.
sample_interval: 0.5

# Number of samples for rolling average filter (1-100).
# Default is 5. (Set to 1 to disable smoothing and use instantaneous raw values).
filter_samples: 5

# Fluid density for depth calculation in kg/m^3:
# - Fresh water: 997.0 (default)
# - Seawater: 1025.0
fluid_density: 997.0

# Automatic background sampling for Moonraker/Mainsail/Fluidd graphs:
# - True: Continuously monitors in background every sample_interval
# - False: Reads on-demand only when G-code commands are executed (recommended)
auto_start: False


# =====================================================================
# Available G-code Commands:
# =====================================================================
#
# 1. Query current pressure and temperature:
#    MS_PRESSURE_QUERY [SENSOR=<name>] [SAMPLES=<1-100>]
#    Examples:
#      MS_PRESSURE_QUERY SENSOR=chamber_pressure
#      MS_PRESSURE_QUERY SENSOR=chamber_pressure SAMPLES=5
#
# 2. Set current pressure as gauge zero reference (tare):
#    MS_PRESSURE_ZERO [SENSOR=<name>] [SAMPLES=<1-100>]
#    Examples:
#      MS_PRESSURE_ZERO SENSOR=chamber_pressure
#      MS_PRESSURE_ZERO SENSOR=chamber_pressure SAMPLES=10
#
# 3. View sensor calibration and connection status:
#    MS_PRESSURE_STATUS [SENSOR=<name>]
#    Example:
#      MS_PRESSURE_STATUS SENSOR=chamber_pressure
#
